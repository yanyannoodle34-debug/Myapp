plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.myapplication'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.myapplication'
        minSdk 21
        targetSdk 34
        versionCode 6
        versionName "1.3.5"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // RecyclerView & CardView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    
    // Networking - Retrofit + OkHttp
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    
    // Lifecycle & ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    
    // JSON Parsing
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Swipe Refresh
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    
    // Google Maps
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
}

def backupDir = file("/sdcard/shared/downloads/Android")
def codeBackupDir = file("/sdcard/shared/downloads/Android/code_backup")

afterEvaluate {
    task copyReleaseApk(type: Copy, dependsOn: 'assembleRelease') {
        from "${buildDir}/outputs/apk/release/"
        into backupDir
        include '*.apk'
    }

    task copyDebugApk(type: Copy, dependsOn: 'assembleDebug') {
        from "${buildDir}/outputs/apk/debug/"
        into backupDir
        include '*.apk'
    }

    task backupCode(type: Copy) {
        from "${rootProject.projectDir}/../"
        into codeBackupDir
        include "**/*.kt"
        include "**/*.xml"
        include "**/*.gradle"
        include "**/*.properties"
        exclude "**/build/**"
        exclude "**/.gradle/**"
        exclude "**/local.properties"
    }

    assembleRelease.finalizedBy(copyReleaseApk)
    assembleDebug.finalizedBy(copyDebugApk)
    assembleDebug.finalizedBy(backupCode)
    assembleRelease.finalizedBy(backupCode)
}
